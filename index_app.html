<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>文字修仙 (重制版)</title>

    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/app_layout.css">
</head>
<body>

<div id="app_ui_container">

    <div id="app_ui_layer_scene" class="app_ui_layer"></div>

    <div id="app_ui_layer_gameplay" class="app_ui_layer"></div>

    <div id="app_ui_layer_ui" class="app_ui_layer">

        <div id="app_ui_start_screen" style="width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center;">

            <div style="width: 200px; height: 200px; border: 3px solid #333; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-bottom: 40px; opacity: 0.8;">
                <div style="font-size: 80px;">道</div>
            </div>

            <h1 class="app_ui_title_large">修仙模拟器</h1>
            <p style="color: #666; margin-bottom: 60px; font-style: italic;">凡人一念，沧海桑田</p>

            <button id="app_ui_btn_enter" class="app_ui_btn">
                踏入仙途
            </button>
        </div>

    </div>

    <div id="app_ui_layer_modal" class="app_ui_layer"></div>
</div>

<script src="js/core/global.js"></script>
<script src="js/core/utils.js"></script>
<script src="js/core/utils_log.js"></script>
<script src="js/core/state.js"></script>

<script src="js/data/data_config.js"></script>
<script src="js/data/data_world.js"></script>
<script src="js/data/data_items.js"></script>

<script src="js/app_main.js"></script>

</body>
</html>
